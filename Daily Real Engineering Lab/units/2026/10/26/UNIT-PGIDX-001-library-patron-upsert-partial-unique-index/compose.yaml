services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: local-lab-only
      POSTGRES_DB: lab
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - ./:/lab:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d lab"]
      interval: 2s
      timeout: 2s
      retries: 20
