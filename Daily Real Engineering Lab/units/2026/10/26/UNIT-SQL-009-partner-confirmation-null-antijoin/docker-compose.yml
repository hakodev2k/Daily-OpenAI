services:
  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab_local_only
      POSTGRES_DB: lab
    volumes:
      - ./:/lab:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d lab"]
      interval: 2s
      timeout: 2s
      retries: 30
