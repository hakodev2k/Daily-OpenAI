services:
  mongo:
    image: mongo:7.0.14
    command: ["mongod", "--bind_ip_all", "--quiet"]
    volumes:
      - ./:/lab:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 }).ok"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
