services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: engineering_lab
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d engineering_lab"]
      interval: 2s
      timeout: 2s
      retries: 15
