apiVersion: apps/v1
kind: Deployment
metadata:
  name: tree-permit-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tree-permit-api
  template:
    metadata:
      labels:
        app: tree-permit-api
    spec:
      containers:
        - name: permit-api
          image: registry.example.invalid/permit-api:lab
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
        - name: audit-agent
          image: registry.example.invalid/audit-agent:lab
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
